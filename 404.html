<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없습니다 — 아룡의 포털</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+KR:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{--neon-cyan:#00f5ff;--neon-pink:#ff006e;--dark-bg:#050510;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--dark-bg);color:#fff;font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;}
  .wrap{padding:20px;max-width:480px;}
  .code{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(4rem,15vw,7rem);background:linear-gradient(135deg,var(--neon-cyan),var(--neon-pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  h1{font-size:1.2rem;margin:16px 0 8px;}
  p{color:rgba(255,255,255,.5);font-size:14px;line-height:1.7;margin-bottom:28px;}
  .home-btn{display:inline-block;font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:2px;color:var(--neon-cyan);border:1px solid rgba(0,245,255,.3);padding:12px 28px;border-radius:3px;text-decoration:none;transition:all .2s;}
  .home-btn:hover{background:var(--neon-cyan);color:#000;box-shadow:0 0 20px #00f5ff88;}
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <h1>페이지를 찾을 수 없습니다</h1>
  <p>요청하신 페이지가 존재하지 않거나 이동되었습니다.<br>홈에서 원하는 툴이나 게임을 찾아보세요.</p>
  <a class="home-btn" href="index.html">← 홈으로 돌아가기</a>
</div>
</body>
</html>
